  <div id="app" class="app" aria-busy="true">

      <section class="view view--map" id="view-map" data-view="map" aria-label="Map"></section>
      <section class="view" id="view-rounds" data-view="rounds" aria-label="Rounds"></section>
      <section class="view" id="view-stats" data-view="stats" aria-label="Stats"></section>
      <section class="view" id="view-courses" data-view="courses" aria-label="Courses"></section>
    </main>

    <nav class="tabbar" id="tabbar" aria-label="Primary">
      <a class="tab" href="#/map" data-tab="map"><svg class="i"><use href="#i-map"/></svg><span>Map</span></a>
      <a class="tab" href="#/rounds" data-tab="rounds"><svg class="i"><use href="#i-list"/></svg><span>Rounds</span></a>
      <button class="tab tab-scan" type="button" data-action="scan" aria-label="Scan a scorecard">
        <span class="tab-scan-btn"><svg class="i"><use href="#i-camera"/></svg></span><span>Scan</span>
      </button>
      <a class="tab" href="#/stats" data-tab="stats"><svg class="i"><use href="#i-chart"/></svg><span>Stats</span></a>
      <a class="tab" href="#/courses" data-tab="courses"><svg class="i"><use href="#i-flag"/></svg><span>Courses</span></a>
    </nav>
  </div>

  <div id="scan-root"></div>
  <div id="sheet-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="false"></div>
